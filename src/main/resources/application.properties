spring.application.name=Cinema-Backend
server.port=8080

# --- CONEXIÓN SUPABASE (POSTGRESQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.zwcstspkycfejqnbofqe.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AQUI_TU_CONTRASEÑA}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Soporte de perfil local opcional para desarrollo seguro (feature/Wilmer) ---
spring.profiles.include=local

# --- CONFIGURACIÓN JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true